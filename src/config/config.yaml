seed: 42

data:
  reviews_path: "data/raw/Electronics.jsonl.gz"
  metadata_path: "data/raw/meta_Electronics.jsonl.gz"
  cache_dir: "data/processed"
  # Reviews to stream from the 6 GB archive. Raise for a denser matrix.
  max_records: 3000000
  chunk_size: 250000
  # Safety budget: the metadata scan stops early once every needed item is
  # resolved, so this only bounds the worst case. Lower it to 844000 if you are
  # using the truncated archive described in README > Data integrity.
  metadata_max_lines: 2000000

filtering:
  min_reviews_user: 5
  min_reviews_item: 5
  # Re-apply the user/item filters until the set is stable (k-core).
  max_filter_passes: 10
  # Treat rating >= threshold as a positive implicit signal.
  binarize: true
  positive_threshold: 4.0

split:
  # "temporal" = leave-last-out by timestamp; "random" = seeded random holdout.
  strategy: "temporal"
  test_ratio: 0.2

als:
  factors: 64
  regularization: 0.01
  iterations: 25
  alpha: 40

eval:
  k: 10
  # null = score every user with held-out items.
  max_users: null

logging:
  level: "INFO"

output:
  model_path: "data/model.pkl"
  user_map_path: "data/user_map.pkl"
  item_map_path: "data/item_map.pkl"
  matrix_path: "data/interactions.npz"
  reports_dir: "reports"
